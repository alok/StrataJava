name = "StrataJava"
version = "0.1.0"
defaultTargets = ["StrataJava", "stratajava", "human_checked_lint"]

[[require]]
name = "Strata"
path = "vendor/Strata"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "9dc39333aa89"

[[require]]
name = "Comparator"
git = "https://github.com/leanprover/comparator.git"
rev = "67bdcfd27946"

[[require]]
scope = "leanprover"
name = "lean4export"
rev = "v4.30.0-rc2"

[[lean_lib]]
name = "StrataJava"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_exe]]
name = "stratajava"
root = "StrataJava.Main"

[[lean_exe]]
name = "human_checked_lint"
root = "StrataJava.HumanCheckedLint"
